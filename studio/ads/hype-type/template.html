<!doctype html>
<html><head><meta charset="utf-8"><title>Hype type</title>
<style>
  .glow{position:absolute;inset:0;background:radial-gradient(50% 35% at 50% 45%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%)}
  .stage{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 42%}
  .world{position:absolute;left:50%;top:42%;transform-style:preserve-3d}
  .card{position:absolute;width:700px;margin-left:-350px;padding:46px 40px;box-sizing:border-box;border-radius:34px;
    background:linear-gradient(170deg, color-mix(in srgb, var(--text) 14%, var(--ground)), color-mix(in srgb, var(--text) 4%, var(--ground)));
    border:2px solid color-mix(in srgb, var(--text) 26%, transparent);
    box-shadow:0 0 80px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 1px 0 color-mix(in srgb, var(--text) 40%, transparent);
    font-family:var(--display);font-weight:700;font-size:calc(74px * var(--wscale));line-height:1.08;text-align:center;backface-visibility:hidden}
  .card img.shot{display:block;height:620px;width:auto;margin:30px auto 0;border-radius:22px}
  .card img.logo{width:240px;height:240px;border-radius:54px;display:block;margin:0 auto 26px}
  .card .link{font-family:var(--body);font-size:48px;color:var(--accent);margin-top:18px}
  .card.words .link{color:var(--accent)}
  .grid{position:absolute;left:-50%;right:-50%;bottom:-10%;height:60%;transform:rotateX(72deg);transform-origin:50% 100%;
    background-image:linear-gradient(color-mix(in srgb, var(--accent) 30%, transparent) 2px, transparent 2px),linear-gradient(90deg, color-mix(in srgb, var(--accent) 30%, transparent) 2px, transparent 2px);
    background-size:120px 120px;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
</style></head>
<body>
<div class="glow"></div>
<div class="grid" id="grid"></div>
<div class="stage"><div class="world" id="world"></div></div>
<script src="../runtime.js"></script>
<script>
// Hype type: one panel per frame, hung in 3D space. The camera glides to each panel and lands on the beat.
const { SB, BRAND, tw, ease, out, frames, file, pace, seeded } = S4F;
const world = document.getElementById("world");
const r = seeded(7);
const beat = SB.bpm ? 60 / SB.bpm : 0;
const snap = (t) => (beat ? Math.round(t / beat) * beat : t);
// Each panel's place: left or right of the middle, deeper each time, turned a little.
const spots = frames.map((f, i) => ({
  f, x: i === 0 ? 0 : (i % 2 ? 1 : -1) * (120 + r() * 120), y: (r() - 0.5) * 300, z: -i * 1600, ry: (i % 2 ? -1 : 1) * (14 + r() * 12), rx: (r() - 0.5) * 10,
}));
const last = frames.length - 1;
spots.forEach((s, i) => {
  const c = document.createElement("div"); c.className = "card words";
  if (s.f.endCard || i === last && SB.cta) {
    const im = document.createElement("img"); im.className = "logo"; im.src = file(BRAND.logo || ""); c.appendChild(im);
  }
  c.appendChild(document.createTextNode(s.f.words || ""));
  if (s.f.screen) { const im = document.createElement("img"); im.className = "shot"; im.src = file(s.f.screen); c.appendChild(im); }
  if ((s.f.endCard || i === last) && SB.cta) { const l = document.createElement("div"); l.className = "link"; l.textContent = SB.cta; c.appendChild(l); }
  c.style.transform = `translate3d(${s.x}px, ${s.y}px, ${s.z}px) rotateY(${s.ry}deg) rotateX(${s.rx}deg) translateY(-50%)`;
  world.appendChild(c); s.el = c;
});
// The camera faces one panel at a time. The world moves by the inverse of that panel's place, so the panel lands
// flat in the middle of the screen. Between panels the place glides and the camera pulls back, then pushes in.
const place = (s) => ({ x: s.x, y: s.y, z: s.z, rx: s.rx, ry: s.ry });
const mix = (a, b, k) => Object.fromEntries(Object.keys(a).map((key) => [key, a[key] + (b[key] - a[key]) * k]));
const MOVE = 0.55 * pace; // a scene's own speed changes the move into it (below)
S4F.setup((t) => {
  let i = 0;
  spots.forEach((s, j) => { if (j > 0 && t >= snap(s.f.start) - 0.55 * S4F.paceOf(s.f)) i = j; });
  const s = spots[i], prev = spots[Math.max(0, i - 1)];
  const arrive = i === 0 ? 0 : snap(s.f.start);
  const mv = 0.55 * S4F.paceOf(s.f);
  const k = i === 0 ? 1 : tw(t, arrive - mv, arrive, ease);
  const c = mix(place(prev), place(s), k);
  const swoop = -700 * Math.sin(Math.PI * k) * (i === 0 ? 0 : 1);
  const drift = Math.min(90, Math.max(0, t - arrive) * 30) + (i === 0 ? -260 * (1 - tw(t, 0, 0.8 * pace, out)) : 0);
  const shake = i > 0 && t > arrive && t < arrive + 0.12 ? Math.sin(t * 120) * 6 : 0;
  world.style.transform = `translateZ(${swoop + drift}px) rotateX(${-c.rx}deg) rotateY(${-c.ry}deg) translate3d(${-c.x + shake}px, ${-c.y}px, ${-c.z}px)`;
  // The panel in front is solid. The one being left fades before the camera passes it; the others wait, dim, in the dark.
  spots.forEach((p, j) => {
    p.el.style.opacity = j === i ? 1 : j === i - 1 ? Math.max(0, 1 - k * 1.8) * 0.9 : j === i + 1 ? 0.3 : 0;
  });
  document.getElementById("grid").style.backgroundPosition = `0 ${t * 240}px`;
});
</script>
</body></html>
