<!doctype html>
<html><head><meta charset="utf-8"><title>Sting</title>
<style>
  .glow{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 38%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%)}
  .logo{position:absolute;left:50%;width:300px;height:300px;margin-left:-150px;border-radius:66px;box-shadow:0 0 90px color-mix(in srgb, var(--accent) 45%, transparent)}
  .line{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;font-size:78px;line-height:1.08;letter-spacing:-0.5px}
  .link{position:absolute;left:0;right:0;text-align:center;font-family:var(--body);font-weight:700;font-size:50px;color:var(--accent)}
  .cast{position:absolute;left:0;width:100%;object-fit:cover;object-position:50% 0;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%);mask-image:linear-gradient(to bottom,transparent,#000 30%)}
</style></head>
<body>
<div class="glow" id="glow"></div>
<div class="safe">
  <img class="logo" id="logo" alt="">
  <div class="line words" id="line"></div>
  <div class="link words" id="link"></div>
</div>
<img class="cast" id="cast" alt="">
<script src="../runtime.js"></script>
<script>
// Sting: logo, one line, link, mascots. About 2 seconds.
const { SB, BRAND, H, SAFE, tw, back, out, frames, file, pace } = S4F;
const f0 = frames[0] || {};
const logo = document.getElementById("logo"), line = document.getElementById("line"), link = document.getElementById("link"), cast = document.getElementById("cast");
logo.src = file(BRAND.logo || "");
line.textContent = f0.words || "";
link.textContent = SB.cta || "";
if (BRAND.cast && (SB.cast || []).length) cast.src = file(BRAND.cast); else cast.style.display = "none";
logo.style.top = "150px"; line.style.top = "510px"; link.style.top = "760px";
cast.style.height = "460px"; cast.style.top = (H - 460) + "px";
const len = SB.length || 2, p = pace;
S4F.setup((t) => {
  const a = tw(t, 0, 0.45 * p, back);
  logo.style.transform = `scale(${0.6 + 0.4 * a})`; logo.style.opacity = Math.min(1, a * 1.5);
  const b = tw(t, 0.25 * p, 0.7 * p, out);
  line.style.opacity = b; line.style.transform = `translateY(${(1 - b) * 40}px)`;
  const c = tw(t, 0.5 * p, 0.9 * p, out);
  link.style.opacity = c; link.style.transform = `translateY(${(1 - c) * 30}px)`;
  const d = tw(t, 0.35 * p, 0.95 * p, back);
  cast.style.transform = `translateY(${(1 - d) * 480}px)`;
  document.getElementById("glow").style.opacity = 0.6 + 0.4 * Math.sin(t * 6) * (t < len ? 1 : 0);
});
</script>
</body></html>
