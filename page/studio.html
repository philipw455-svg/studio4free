<title>Studio4Free</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: liquid glass. A fixed colour wash, clear panels with bright edges, a floating tab capsule. One committed look. */
:root{
  --base:#1a1150; --ink:#ffffff; --muted:rgba(255,255,255,.8); --faint:rgba(255,255,255,.56);
  --glass:rgba(255,255,255,.15); --glass-2:rgba(255,255,255,.23); --edge:rgba(255,255,255,.38); --hair:rgba(255,255,255,.22);
  --solid:rgba(255,255,255,.93); --deep:#2a1a5e;
  --ok:rgba(64,222,154,.42); --wait:rgba(255,186,66,.46); --info:rgba(110,170,255,.5); --stage:rgba(8,6,30,.55);
  --lift:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.1),0 10px 28px rgba(10,8,40,.2);
  --blur:blur(22px) saturate(180%);
  --font:"Outfit",-apple-system,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
  --r:26px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--base);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:rgba(40,24,110,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.wash{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 60% at 8% 0%,#e0633c 0%,transparent 55%),radial-gradient(110% 60% at 100% 28%,#9a4ff0 0%,transparent 60%),
  radial-gradient(120% 70% at 15% 100%,#2468f0 0%,transparent 60%),linear-gradient(160deg,#35196a,#0b2460)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{font-weight:700;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
a{color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mono,.t,.tcode{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

.top{display:flex;align-items:center;gap:10px;padding-block:16px 2px}
.top h1{font-size:19px;font-weight:600;flex:1;min-width:0;opacity:.94}
.top h1 i{font-style:normal;opacity:.7}
.save{font-size:12.5px;color:var(--muted)}
.back{border:1px solid var(--edge);background:var(--glass);box-shadow:var(--lift);border-radius:999px;min-height:40px;padding:0 16px;font-weight:600}

.btn{border:1px solid var(--edge);background:var(--glass);box-shadow:var(--lift);border-radius:999px;min-height:48px;padding:0 18px;font-weight:600;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--solid);color:var(--deep);border-color:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.warn{color:var(--ink);background:rgba(255,90,110,.32)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 140px;min-width:0}

.card{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--lift);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
button.card{text-align:left;width:100%}
.card h3{font:600 19px/1.25 var(--font);overflow-wrap:anywhere}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>h2{font-size:34px}
.label{font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font-weight:600;font-size:11px;line-height:1;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--glass-2);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok)} .pill.wait{background:var(--wait)} .pill.info{background:var(--info)}
.pill.hot{background:var(--solid);color:var(--deep)}
.pill.bad{background:rgba(255,84,104,.62)}
.rules ul{margin:6px 0 0;padding-left:18px}
.rules li{margin-bottom:4px}
.note{background:var(--glass-2);border:1px solid var(--edge);border-radius:20px;padding:12px 16px;font-size:14.5px}
.empty{border:1.5px dashed var(--edge);border-radius:var(--r);padding:22px 18px;color:var(--muted)}
.empty b{color:var(--ink)}

.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.field>.lab{font-weight:600;font-size:15.5px}
.hint{font-size:13.5px;color:var(--muted)}
input[type=text],input[type=url],input[type=datetime-local],textarea,select{width:100%;min-width:0;min-height:48px;background:rgba(255,255,255,.13);border:1px solid var(--edge);border-radius:18px;padding:11px 16px;font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);background:rgba(255,255,255,.2)}
textarea{min-height:92px;resize:vertical;border-radius:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--edge);background:var(--glass);border-radius:999px;min-height:42px;padding:0 16px;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--deep);border-color:transparent;font-weight:600}

/* clip previews: a row of tall tiles that plays the finished clips */
.reel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px}
.reel::-webkit-scrollbar{display:none}
.tile{flex:0 0 128px;aspect-ratio:9/16;scroll-snap-align:start;position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--edge);box-shadow:var(--lift);background:var(--stage);padding:0;text-align:left;color:var(--ink)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile .when{position:absolute;left:8px;top:8px;font-weight:600;font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(10,8,40,.5);font-variant-numeric:tabular-nums}
.tile .ttl{position:absolute;inset:auto 0 0;padding:26px 10px 10px;font-weight:600;font-size:12.5px;line-height:1.25;background:linear-gradient(transparent,rgba(10,8,40,.78));overflow-wrap:anywhere}
.tile.blank{background:var(--glass);border-style:dashed;box-shadow:none}
.tile.blank .ttl{background:none;color:var(--muted);font-weight:500}
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(12,8,44,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovin{width:min(100%,380px);max-height:100%;display:flex;flex-direction:column;gap:10px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--lift);border-radius:30px;padding:14px;overflow:auto}
.ovin video{width:100%;max-height:62vh;aspect-ratio:9/16;border-radius:20px;background:var(--stage);object-fit:contain;display:block;margin-inline:auto}
.ovin b{font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}

/* shortlist and clips */
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding-block:12px;border-top:1px solid var(--hair)}
.pick:first-of-type{border-top:0}
.pick b{font-weight:600;overflow-wrap:anywhere}
.pick .tcode{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.clip{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:start}
.clip video,.clip .ph{width:118px;aspect-ratio:9/16;border-radius:18px;background:var(--stage);object-fit:cover;display:block;border:1px solid var(--edge)}
.clip .ph{display:grid;place-items:center;color:var(--muted);font-weight:500;font-size:12px;text-align:center;padding:6px}
.clip .side{display:flex;flex-direction:column;gap:9px;min-width:0}

/* schedule */
.day{display:flex;flex-direction:column;gap:8px}
.day>h3{font-weight:600;font-size:15px;padding-top:6px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--lift);border-radius:22px;padding:12px 16px}
.slot.open{background:transparent;border:1.5px dashed var(--edge);box-shadow:none;color:var(--muted)}
.slot .t{font-weight:600;font-size:15px;padding-top:1px}
.slot .b{display:flex;flex-direction:column;gap:7px;min-width:0}
.slot .b b{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.slot .st{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* floating tab capsule */
.tabs{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:420px;margin-inline:auto;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid var(--edge);box-shadow:var(--lift);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tabs button{flex:1 1 0;border:0;background:transparent;border-radius:999px;min-height:50px;font-weight:600;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button[aria-current="page"]{background:var(--solid);color:var(--deep)}
.tabs svg{width:21px;height:21px}
@media (prefers-reduced-motion:reduce){ .btn{transition:none} }
</style>

<div class="wash" aria-hidden="true"></div>
<div class="wrap">
  <div class="top">
    <button class="back" id="back" type="button" hidden>Back</button>
    <h1>Studio<i>4</i>Free</h1>
    <span class="save" id="save" role="status"></span>
  </div>
  <div id="app" class="sect"><p class="muted">Loading your studio…</p></div>
</div>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-v="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="5" height="6" rx="1.5"/><rect x="10" y="14" width="5" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Jobs</button>
  <button type="button" data-v="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button type="button" data-v="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setup</button>
</nav>

<script>
(() => {
'use strict';
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){ const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v; else e.setAttribute(k, v === true ? '' : v); }
  for (const kid of kids.flat(3)){ if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
const DEF = { times:['12:15','17:00'], tz:'America/Chicago', services:['YouTube','TikTok'], brand:'', descTail:'',
  count:'10', len:'20 to 40 seconds', kinds:['Strong opinions','Funny moments','Emotional moments'], fit:'Black banner with title and brand', zoom:'Smooth', captions:'Yes', language:'Mute it', parts:'Split long stories into parts', overlay:'First banner' };
const COUNTS = ['3','5','10','20','As many as are good'];
const LENS = ['Under 20 seconds','20 to 40 seconds','40 to 60 seconds','Whatever the moment needs'];
const KINDS = ['Strong opinions','Funny moments','Stories','Advice and tips','Emotional moments','Surprising facts','Disagreements','Quotable one-liners'];
const ESTYLES = ['Quick-cut talking clip','Raw funny moments','Heavy-edit comedy'];
const EDITS = ['Cut filler words','Cut silences','Add captions','Mute strong language','Add a title at the top','Make it vertical'];
const STATUS = { sent:['Waiting for Claude Code','wait'], working:['Claude Code is working','info'], shortlist:['Pick your clips','hot'], cutting:['Cutting clips','info'], checking:['Checking the rules','info'],
  review:['Check the clips','hot'], scheduling:['Sending to Buffer','info'], scheduled:['Scheduled','ok'], done:['Done','ok'], blocked:['Blocked','wait'] };

const S = { view:'jobs', id:null, jobs:new Map(), set:Object.assign({}, DEF), store:'wait', note:'', form:null, showPast:false };
let col = null, setDoc = null, comments = null, downloads = null;
const app = document.getElementById('app'), saveEl = document.getElementById('save'), back = document.getElementById('back');
const say = t => { saveEl.textContent = t; };
const ytOK = u => /^https:\/\/((www\.|m\.)?youtube\.com\/(watch\?|shorts\/|live\/)|youtu\.be\/)[\w?=&%.\-/]+$/i.test(String(u).trim());

/* ---------- time ---------- */
function tzOff(d, tz){ const p = {}; for (const x of new Intl.DateTimeFormat('en-US', {timeZone:tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}).formatToParts(d)) p[x.type] = +x.value;
  return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(d.getTime() / 1000) * 1000) / 60000; }
function wallToISO(wall){ const m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(wall); if (!m) return ''; const g = Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]);
  let t = g - tzOff(new Date(g), S.set.tz) * 60000; t = g - tzOff(new Date(t), S.set.tz) * 60000; return new Date(t).toISOString(); }
function wall(iso){ const d = new Date(iso); if (isNaN(d)) return ''; return new Date(d.getTime() + tzOff(d, S.set.tz) * 60000).toISOString().slice(0, 16); }
const dayKey = iso => wall(iso).slice(0, 10), hm = iso => wall(iso).slice(11, 16);
function dayName(key){ const d = new Date(key + 'T12:00:00Z'); return d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric', timeZone:'UTC'}); }
const todayKey = () => dayKey(new Date().toISOString());
function tcode(s){ s = Math.max(0, +s || 0); const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = Math.floor(s % 60); return (hh ? hh + ':' : '') + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); }

/* ---------- storage ---------- */
function localGet(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function localSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
async function saveJob(id, patch){
  const j = S.jobs.get(id); if (!j) return; Object.assign(j, patch, {updatedAt:Date.now()}); say('Saving…');
  try { if (S.store === 'db') await col.doc(id).update(Object.assign({}, patch, {updatedAt:j.updatedAt})); else localSet('s4f.jobs', Object.fromEntries(S.jobs)); say(S.store === 'db' ? 'Saved' : 'Saved on this device only'); }
  catch (e) { say('Not saved. Check your connection and change it again.'); }
}
async function addJob(doc){
  const now = Date.now(); Object.assign(doc, {createdAt:now, updatedAt:now}); let id;
  try { if (S.store === 'db'){ const ref = col.doc(); id = ref.id; await ref.set(doc); } else { id = 'l' + now.toString(36); }
    S.jobs.set(id, doc); if (S.store !== 'db') localSet('s4f.jobs', Object.fromEntries(S.jobs)); return id; }
  catch (e) { say('The job could not be saved. Check your connection.'); return null; }
}
async function dropJob(id){ S.jobs.delete(id); try { if (S.store === 'db') await col.doc(id).delete(); else localSet('s4f.jobs', Object.fromEntries(S.jobs)); } catch (e) { say('The job could not be deleted.'); } go('jobs'); }
async function saveSet(){ say('Saving…'); try { if (S.store === 'db') await setDoc.set(S.set); else localSet('s4f.set', S.set); say(S.store === 'db' ? 'Saved' : 'Saved on this device only'); } catch (e) { say('Settings were not saved.'); } }
async function tell(el, text){
  if (!comments) return 'none';
  try { const can = await comments.canSendToClaude(); if (can !== 'available') return can; const anchor = await comments.anchorFor(el); await comments.sendToClaude({anchor, text}); return 'sent'; }
  catch (e) { return (e && e.code) || 'error'; }
}
const told = r => r === 'sent' ? 'Sent to Claude Code. It starts without you asking.' : 'Saved. No Claude Code session is listening. Open Claude Code in the studio4free repository and say "run the studio jobs".';

/* ---------- small widgets ---------- */
function chips(opts, cur, multi, onPick){
  const g = h('div', {class:'chips', role:'group'});
  for (const o of opts){ const on = multi ? (cur || []).includes(o) : cur === o;
    g.append(h('button', {class:'chip', type:'button', 'aria-pressed':String(on), onclick:e => { const b = e.currentTarget, now = b.getAttribute('aria-pressed') !== 'true';
      if (!multi) for (const x of g.children) x.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-pressed', String(now)); onPick(o, now); }}, o)); }
  return g;
}
const field = (label, hint, ctl, id) => h('div', {class:'field'}, id ? h('label', {for:id}, label) : h('div', {class:'lab'}, label), hint ? h('p', {class:'hint'}, hint) : null, ctl);
const pillFor = st => { const t = String(st || '').toLowerCase(); return /publish|posted|sent/.test(t) ? 'ok' : /schedul/.test(t) ? 'info' : /draft|plan/.test(t) ? 'wait' : /refus|fail|block/.test(t) ? 'hot' : ''; };
function allClips(){ const out = []; for (const [id, j] of S.jobs) for (const c of (j.clips || [])) if (c.publishAt) out.push({id, j, c}); return out.sort((a, b) => new Date(a.c.publishAt) - new Date(b.c.publishAt)); }

/* ---------- clip previews ---------- */
const hasVid = c => /^[0-9a-f]{32}$/.test((c && c.asset) || '');
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting){ const v = e.target; if (!v.getAttribute('src')) v.src = v.dataset.src; io.unobserve(v); } }, {rootMargin:'300px'}) : null;
function lazyVid(asset, controls){ const v = h('video', {controls:controls || null, playsinline:true, muted:controls ? null : true, preload:'metadata', 'data-src':'/_blob/' + asset + '#t=0.1'}); if (!controls) v.muted = true; if (io) io.observe(v); else v.src = v.dataset.src; return v; }
const dayShort = iso => new Date(dayKey(iso) + 'T12:00:00Z').toLocaleDateString(undefined, {weekday:'short', timeZone:'UTC'});
function reel(){
  const now = Date.now(), vids = []; for (const [id, j] of S.jobs) for (const c of (j.clips || [])) if (hasVid(c)) vids.push({id, j, c});
  const up = vids.filter(x => x.c.publishAt && new Date(x.c.publishAt) >= now).sort((a, b) => new Date(a.c.publishAt) - new Date(b.c.publishAt));
  const rest = vids.filter(x => !up.includes(x)).sort((a, b) => new Date(b.c.publishAt || 0) - new Date(a.c.publishAt || 0));
  const show = up.concat(rest).slice(0, 12);
  const tiles = show.length ? show.map(x => h('button', {class:'tile', type:'button', 'aria-label':'Watch ' + (x.c.title || 'clip ' + x.c.n), onclick:() => player(x)}, lazyVid(x.c.asset),
      h('span', {class:'when'}, x.c.publishAt ? dayShort(x.c.publishAt) + ' ' + hm(x.c.publishAt) : 'No time'), h('span', {class:'ttl'}, String(x.c.onScreen || x.c.title || 'Clip ' + x.c.n))))
    : [0, 1, 2].map(i => h('div', {class:'tile blank'}, h('span', {class:'ttl'}, i ? '' : 'Your finished clips play here')));
  return h('div', {class:'sect'}, h('div', {class:'label'}, up.length ? 'Clip previews · next to post first' : 'Clip previews'), h('div', {class:'reel', role:'group', 'aria-label':'Clip previews'}, tiles));
}
function player(x){
  const close = () => ov.remove();
  const ov = h('div', {class:'ov', role:'dialog', 'aria-label':'Clip preview', onclick:e => { if (e.target === ov) close(); }},
    h('div', {class:'ovin'}, h('video', {controls:true, playsinline:true, autoplay:true, src:'/_blob/' + x.c.asset}), h('b', null, String(x.c.title || 'Clip ' + x.c.n)),
      h('p', {class:'small muted'}, (x.c.publishAt ? dayName(dayKey(x.c.publishAt)) + ', ' + hm(x.c.publishAt) + ' · ' : '') + (x.j.name || '')),
      h('div', {class:'row'}, h('button', {class:'btn grow', type:'button', onclick:() => { close(); go('job', x.id); }}, 'Open job'), h('button', {class:'btn pri grow', type:'button', onclick:close}, 'Close'))));
  document.body.append(ov);
}

/* ---------- views ---------- */
function go(v, id){ S.view = v; S.id = id || null; S.form = null; try { location.hash = v === 'job' ? 'job-' + id : v; } catch (e) {} render(); scrollTo(0, 0); }
function render(){
  back.hidden = !(S.view === 'job' || S.view === 'new');
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', (S.view === 'job' || S.view === 'new' ? 'jobs' : S.view) === b.dataset.v ? 'page' : 'false'));
  if (S.store === 'wait'){ app.replaceChildren(h('p', {class:'muted'}, 'Loading your studio…')); return; }
