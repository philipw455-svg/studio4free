<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: liquid glass. A fixed colour wash, clear panels with bright edges, a floating tab capsule. One committed look. */
:root{
  --base:#1a1150; --ink:#ffffff; --muted:rgba(255,255,255,.8); --faint:rgba(255,255,255,.56);
  --glass:rgba(255,255,255,.15); --glass-2:rgba(255,255,255,.23); --edge:rgba(255,255,255,.38); --hair:rgba(255,255,255,.22);
  --solid:rgba(255,255,255,.93); --deep:#2a1a5e;
  --ok:rgba(64,222,154,.42); --wait:rgba(255,186,66,.46); --info:rgba(110,170,255,.5); --stage:rgba(8,6,30,.55);
  --lift:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.1),0 10px 28px rgba(10,8,40,.2);
  --blur:blur(22px) saturate(180%);
  --font:"Outfit",-apple-system,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
  --r:26px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--base);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:rgba(40,24,110,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.wash{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(120% 60% at 8% 0%,#e0633c 0%,transparent 55%),radial-gradient(110% 60% at 100% 28%,#9a4ff0 0%,transparent 60%),
  radial-gradient(120% 70% at 15% 100%,#2468f0 0%,transparent 60%),linear-gradient(160deg,#35196a,#0b2460)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{font-weight:700;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
a{color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mono,.t,.tcode{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

.top{display:flex;align-items:center;gap:10px;padding-block:16px 2px}
.top h1{font-size:19px;font-weight:600;flex:1;min-width:0;opacity:.94}
.top h1 i{font-style:normal;opacity:.7}
.save{font-size:12.5px;color:var(--muted)}
.back{border:1px solid var(--edge);background:var(--glass);box-shadow:var(--lift);border-radius:999px;min-height:40px;padding:0 16px;font-weight:600}

.btn:active{transform:scale(.97)}
.btn.pri{background:var(--solid);color:var(--deep);border-color:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.warn{color:var(--ink);background:rgba(255,90,110,.32)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 140px;min-width:0}

.pill.bad{background:rgba(255,84,104,.62)}

.note{background:var(--glass-2);border:1px solid var(--edge);border-radius:20px;padding:12px 16px;font-size:14.5px}
.empty{border:1.5px dashed var(--edge);border-radius:var(--r);padding:22px 18px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.field>.lab{font-weight:600;font-size:15.5px}
.hint{font-size:13.5px;color:var(--muted)}
input[type=text],input[type=url],input[type=datetime-local],input[type=time],textarea,select{width:100%;min-width:0;min-height:48px;background:rgba(255,255,255,.13);border:1px solid var(--edge);border-radius:18px;padding:11px 16px;font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
input::placeholder,textarea::placeholder{color:var(--faint)}

.reel::-webkit-scrollbar{display:none}

.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile .when{position:absolute;left:8px;top:8px;font-weight:600;font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(10,8,40,.5);font-variant-numeric:tabular-nums}
.tile .ttl{position:absolute;inset:auto 0 0;padding:26px 10px 10px;font-weight:600;font-size:12.5px;line-height:1.25;background:linear-gradient(transparent,rgba(10,8,40,.78));overflow-wrap:anywhere}
.tile.blank{background:var(--glass);border-style:dashed;box-shadow:none}
.tile.blank .ttl{background:none;color:var(--muted);font-weight:500}
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(12,8,44,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovin{width:min(100%,380px);max-height:100%;display:flex;flex-direction:column;gap:10px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--lift);border-radius:30px;padding:14px;overflow:auto}
.ovin video{width:100%;max-height:62vh;aspect-ratio:9/16;border-radius:20px;background:var(--stage);object-fit:contain;display:block;margin-inline:auto}
.ovin b{font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}

/* shortlist and clips */
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding-block:12px;border-top:1px solid var(--hair)}
.pick:first-of-type{border-top:0}
.pick b{font-weight:600;overflow-wrap:anywhere}
.pick .tcode{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.clip{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:start}
.clip video,.clip .ph{width:118px;aspect-ratio:9/16;border-radius:18px;background:var(--stage);object-fit:cover;display:block;border:1px solid var(--edge)}
.clip .ph{display:grid;place-items:center;color:var(--muted);font-weight:500;font-size:12px;text-align:center;padding:6px}
.clip .side{display:flex;flex-direction:column;gap:9px;min-width:0}
.cliprow{gap:8px}
.cliprow h3{font-size:17px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:999px;min-height:42px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--deep)}
.from{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}

.day{display:flex;flex-direction:column;gap:8px}
.day>h3{font-weight:600;font-size:15px;padding-top:6px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--lift);border-radius:22px;padding:12px 16px}

.slot .t{font-weight:600;font-size:15px;padding-top:1px}
.slot .b{display:flex;flex-direction:column;gap:7px;min-width:0}
.slot .b b{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.slot .st{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* floating tab capsule */
.tabs{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:420px;margin-inline:auto;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid var(--edge);box-shadow:var(--lift);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:999px;min-height:50px;font-weight:600;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tabs button[aria-current="page"]{background:var(--solid);color:var(--deep)}
.tabs svg{width:21px;height:21px}
.tabs[hidden]{display:none}

/* accounts, the walkthrough and the overlay previews */
.keybig{font-weight:700;font-size:clamp(22px,7.6vw,34px);line-height:1.2;letter-spacing:.03em;text-align:center;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}
.prog{height:6px;border-radius:999px;background:var(--glass-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--solid)}
.ovs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ovt{display:flex;flex-direction:column;gap:6px;min-width:0;padding:8px 8px 10px;text-align:left;border:1px solid var(--edge);background:var(--glass);border-radius:22px}
.ovt[aria-pressed="true"]{background:var(--solid);color:var(--deep);border-color:transparent}
.ovt>b{font-weight:600;font-size:15px;padding-inline:4px}
.ovd{font-size:12.5px;line-height:1.3;padding-inline:4px;opacity:.86}
/* a 9:16 stand-in for the video. Children are placed in percent of the real 1080 x 1920 frame, and text scales with the tile (cqw). */
.ovp,.ovp .vid{background:radial-gradient(ellipse 20% 11.25% at 50% 40%,#e3b190 98%,transparent),radial-gradient(ellipse 44% 22% at 50% 76%,#31496b 98%,transparent),linear-gradient(165deg,#7c8798,#39414f)}
.ovp .vid.w{background:radial-gradient(ellipse 9% 16% at 50% 42%,#e3b190 98%,transparent),radial-gradient(ellipse 20% 34% at 50% 100%,#31496b 98%,transparent),linear-gradient(165deg,#7c8798,#39414f)}
.ovp{display:block;position:relative;aspect-ratio:9/16;overflow:hidden;border-radius:16px;container-type:inline-size;color:#fff;font-weight:700;font-size:6px}
.ovp i{position:absolute;display:block;font-style:normal;white-space:nowrap}
.ovp .tx{transform:translateY(-50%);line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.ovp b{font-weight:inherit}
@media (min-width:600px){ .ovs{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ .btn{transition:none} }
</style>

    h('span', {class:'ovp', 'aria-hidden':'true'}, ovArt(name)), h('b', null, name), h('span', {class:'ovd'}, line))));
  return field('Overlay', 'Tap a look. The first five keep every word inside the safe zone. "First banner" is the older look and does not. The Poster title shows for 2 seconds and fades. The yellow brand tag never moves, and the captions sit under the tag.', g);

const SVCS = ['YouTube','TikTok','Instagram'], DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    field('Buffer login', 'The name of the saved Buffer login this account posts with, such as main. It is only a name. Never put a key or a password here. Letters, numbers, - and _ only.',

  overlay: ovField,

    field('Strong language', '"Mute it" makes each swear word silent in the clip.', pick('language', ['Mute it','Leave it in'], 'Mute it'))],
  brand: () => [txt('brand', 'Brand text on each clip', 'It sits beside your mark in the banner, such as your site name. Leave it empty for none.'),
    txt('descTail', 'Line added to every description', 'For example a link to your app.', true),
    txt('comment', 'First comment on each post', 'Buffer adds this comment under each Instagram reel. On YouTube you add and pin it yourself.', true),
    field('End card days', S.acct && S.acct.legacy ? 'Clips that post on these days end with the 2-second Noxi end card.' : 'Clips that post on these days end with a 2-second end card. A new account needs its own end card video first.',

function vSetup(){
  const card = (label, kids) => h('div', {class:'card'}, h('div', {class:'label'}, label), kids);
  return [h('div', {class:'sect'}, h('h2', null, 'Setup'), h('p', {class:'muted'}, 'Your usual answers. Every new job starts from these.')),
    acctCard(), card('Posting', [F.times(), F.post()]), card('Look of each clip', [F.overlay(), F.motion()]), card('Brand', F.brand()), card('New clipping jobs start with', F.clips())];

// The walkthrough: the same fields as Setup, one group per screen. Every choice saves at once, so "Finish later" loses nothing.
const STEPS = [['Channels', 'Choose where your clips post. Then name each channel the way Buffer shows it.', F.post], ['Reel style', 'Pick the look of your reels.', F.overlay],
  ['Motion and captions', 'How the picture moves and what shows on screen.', F.motion], ['Brand', 'What every clip carries with it.', F.brand],
  ['Post times', 'When your clips post each day.', F.times], ['Clip defaults', 'Every new clipping job starts with these.', F.clips]];
function vWiz(){
  const n = S.wiz, st = STEPS[n - 1], last = n === STEPS.length, step = d => { S.wiz = n + d; render(); scrollTo(0, 0); }, end = done => { S.wiz = 0; if (done) saveAcct({setupDone:true}); go('jobs'); };
  return [h('div', {class:'sect'}, h('div', {class:'label'}, 'Step ' + n + ' of ' + STEPS.length), h('div', {class:'prog', 'aria-hidden':'true'}, h('i', {style:'width:' + n / STEPS.length * 100 + '%'})), h('h2', null, st[0]), h('p', {class:'muted'}, st[1])),
    h('div', {class:'card'}, st[2]()),

// Sign in, create an account, and show a new account number. Nothing here uses location.hash.
function vGate(){
  const G = S.gate, REM = 'Remember on this device', msg = G.msg ? h('p', {class:'note', role:'status', id:'f-gate-msg'}, G.msg) : null, desc = msg ? 'f-gate-msg' : null;
  const to = mode => { G.mode = mode; G.msg = ''; render(); scrollTo(0, 0); };
  // A message about a field: focus goes back into the field, and its aria-describedby reads the message with it.
  const fail = (id, m) => { G.msg = m; render(); refocus(id); };
  // One create or sign-in at a time. A redraw makes a new button, so the guard is on the gate and not on the button.
  const make = async (b, name, legacy) => { if (G.wait) return; G.wait = true; b.disabled = true; let r; try { r = await makeAcct(name, legacy, G.remember); } finally { G.wait = false; } if (r) G.msg = r; render(); scrollTo(0, 0); };
  if (G.mode === 'show'){ const num = h('p', {class:'keybig', id:'acct-key'}, G.key);
    return [h('div', {class:'sect'}, h('h2', null, 'Save your account number'), h('p', {class:'muted'}, 'This number is the only way back into your studio. There is no password. Save it somewhere safe now.')),
      h('div', {class:'card'}, num, copyBtn(G.key, num, 'f-key-copy')),
      h('button', {class:'btn pri wide', type:'button', id:'f-key-saved', onclick:() => { S.gate = null; S.wiz = S.acct.setupDone ? 0 : 1; go('jobs'); }}, 'I saved it, continue')]; }
  if (G.mode === 'new') return [h('div', {class:'sect'}, h('h2', null, 'Create a new account'), h('p', {class:'muted'}, 'Give the account a name, such as the channel it runs. You get an account number to sign in with. There is no password.')),
    h('div', {class:'card'}, field('Account name', null, h('input', {type:'text', id:'f-new-name', maxlength:60, 'aria-describedby':desc, value:G.name || '', oninput:e => { G.name = e.target.value; }}), 'f-new-name'), msg,
      h('button', {class:'btn pri wide', type:'button', id:'f-new-make', onclick:e => { const name = (G.name || '').trim(); if (!name) return fail('f-new-name', 'Give the account a name first.'); make(e.currentTarget, name, false); }}, 'Create my account'),
      h('button', {class:'btn wide', type:'button', id:'f-new-back', onclick:() => to('in')}, 'Back to sign in'))];
  const n = oldJobs();
  const open = async b => { if (G.wait) return; const k = normKey(G.key); if (!k) return fail('f-key', 'That is not an account number. An account number looks like S4F-ABCD-EFGH.');
    G.wait = true; b.disabled = true; const r = await openAcct(k); G.wait = false;
    if (r) return fail('f-key', r !== 'none' ? r : db ? 'No account has that number. Check it and try again.' : NOLOCAL);
    localSet('s4f.key', G.remember ? k : ''); S.gate = null; route(); scrollTo(0, 0); };   // route() opens the link the page was opened with, if it is this account's
  const btn = h('button', {class:'btn pri wide', type:'button', id:'f-key-open', onclick:() => open(btn)}, 'Open my studio');
  return [h('div', {class:'sect'}, h('h2', null, 'Sign in'), h('p', {class:'muted'}, 'Enter your account number to open your studio. There is no password.')),
    offerOld() ? h('div', {class:'card'}, h('div', {class:'label'}, 'Your existing studio'),

      h('button', {class:'btn pri wide', type:'button', id:'f-old-move', onclick:e => make(e.currentTarget, 'My studio', true)}, 'Move my existing studio into an account')) : null,
    h('div', {class:'card'}, field('Account number', null, h('input', {type:'text', id:'f-key', placeholder:'S4F-ABCD-EFGH', autocapitalize:'characters', autocomplete:'off', spellcheck:'false', 'aria-describedby':desc, value:G.key || '', oninput:e => { G.key = e.target.value; }, onkeydown:e => { if (e.key === 'Enter') open(btn); }}), 'f-key'), msg, btn,
      chips([REM], G.remember ? [REM] : [], true, (o, on) => { G.remember = on; }, 'f-key-remember')),
    h('button', {class:'btn wide', type:'button', id:'f-new', onclick:() => to('new')}, 'Create a new account')];
}

/* ---------- start ---------- */
back.onclick = () => go('jobs');
document.querySelectorAll('.tabs button').forEach(b => { b.onclick = () => go(b.dataset.v); });
function route(){ const m = /^#job-(.+)$/.exec(location.hash), v = location.hash.slice(1); if (m && S.jobs.has(m[1])){ S.view = 'job'; S.id = m[1]; } else if (['jobs','queue','schedule','setup'].includes(v) && S.view !== 'new'){ S.view = v; S.id = null; } render(); }
addEventListener('hashchange', route);
// Is there a studio from before accounts that no account holds yet? The sign-in screen offers to move it.
function checkOld(n){
  (db ? Promise.all([db.doc('meta/legacy').get(), db.doc('settings/main').get()]).then(([m, s]) => ({claimed:m.exists, main:s.exists}))
    : Promise.resolve({claimed:!!localGet('s4f.legacyClaimed', false), main:localGet('s4f.set', null) !== null})).then(o => { S.old = o; const G = S.gate;
      // Draw only when the card has to appear. It is drawn even while the owner is in the number field, and focus goes back there.
      if (!G || G.mode !== 'in' || G.wait || S.busy || S.store === 'wait' || !offerOld()) return;
      const id = (document.activeElement || {}).id; render(); if (id) refocus(id); },
    // One failed read must not hide the existing studio for the whole visit. Ask again, a little later each time.
    e => { if (again(e)) setTimeout(checkOld, Math.min(30000, 3000 * (n || 1)), (n || 1) + 1); });
}
// Runs once, when the store is known. A number remembered on this device opens its account without asking.
async function boot(){
  checkOld(); const k = normKey(localGet('s4f.key', ''));
  if (k){ const r = await openAcct(k, 3); if (r) Object.assign(S.gate, {key:k, msg:r !== 'none' ? r : db ? 'The account remembered on this device no longer exists. Enter another number or create a new account.' : NOLOCAL}); else S.gate = null; }
  S.busy = false; if (S.store !== 'wait') route();
}
function useLocal(){ db = null; S.store = 'local'; ALL = new Map(Object.entries(localGet('s4f.jobs', {}))); boot(); }
const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;

      if (first) return route(); soft(); },

    boot();
  }).catch(useLocal);
  cl.use('comments').then(x => { comments = x || null; }).catch(() => {});
  cl.use('downloads').then(x => { downloads = x || null; }).catch(() => {});
} else useLocal();
})();
